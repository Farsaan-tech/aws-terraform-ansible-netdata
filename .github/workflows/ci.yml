name: Infrastructure CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -recursive
      - name: Initialize providers without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate

 
  ansible:
    name: Ansible lint and syntax
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible tooling
        run: python -m pip install --upgrade ansible-core ansible-lint

      - name: Lint playbooks
        run: ansible-lint playbooks/site.yml

      - name: Syntax check
        run: ansible-playbook -i inventory/hosts.ini.example playbooks/site.yml --syntax-check
