---
- name: Refresh APT metadata on Ubuntu
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Refresh DNF metadata on Amazon Linux
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['distribution'] == 'Amazon'

- name: Ensure Python is available for Ansible modules on Amazon Linux
  ansible.builtin.dnf:
    name: python3
    state: present
  when: ansible_facts['distribution'] == 'Amazon'
